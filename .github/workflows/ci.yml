name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, dom, sqlite3, pdo_sqlite
          coverage: none

      - name: Preparar entorno
        # Los secretos de test los fija phpunit.xml: no se usan los de .env.
        run: cp .env.example .env

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar formato
        run: vendor/bin/pint --test

      - name: Ejecutar tests
        run: php artisan test

  frontend:
    name: Frontend · React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build
